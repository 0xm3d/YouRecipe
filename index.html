
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Découvrez, recherchez et partagez vos recettes préférées avec YouRecipe."
    />
    <title>YouRecipe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="bg-white shadow-sm p-6">
      <h1 class="text-3xl font-bold text-primary text-center">
        YouRecipe
      </h1>
      <p class="text-text text-center mt-2">
        Découvrez vos recettes préférées.
      </p>
    </header>

    <main class="max-w-7xl mx-auto p-6">

      <!-- Titre et nombre de recettes -->
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold text-text">
          Explorer les recettes
        </h2>

        <p class="text-text">
          Nombre total de recettes :
          <span id="recipe-count">0</span>
        </p>
      </div>

      <!-- Recherche et ajout -->
      <div class="flex flex-wrap gap-3 mb-8">
        <input
          id="search-input"
          type="search"
          placeholder="Rechercher une recette..."
          aria-label="Rechercher une recette"
          class="flex-1 min-w-0 border border-gray-300 rounded-lg px-4 py-3"
        />

        <button
          id="search-button"
          type="button"
          class="bg-primary text-white px-6 py-3 rounded-lg"
        >
          Rechercher
        </button>

        <button
          id="add-button"
          type="button"
          aria-haspopup="dialog"
          aria-controls="recipe-dialog"
          class="bg-primary text-white px-6 py-3 rounded-lg"
        >
          Ajouter
        </button>

        <!-- Dialog -->
        <dialog
          id="recipe-dialog"
          aria-labelledby="dialog-title"
          class="rounded-xl shadow-xl p-6 w-full max-w-lg mx-auto backdrop:bg-black/50"
        >
          <h2
            id="dialog-title"
            class="text-2xl font-bold text-primary mb-6"
          >
            Ajouter une recette
          </h2>

          <form id="recipe-form" class="flex flex-col gap-4">

            <!-- Nom de la recette -->
            <div>
              <label
                for="recipe-name"
                class="block mb-2 font-medium"
              >
                Nom de la recette
              </label>

              <input
                type="text"
                id="recipe-name"
                name="name"
                minlength="3"
                maxlength="60"
                required
                aria-describedby="name-error"
                placeholder="Nom de la recette"
                class="w-full border border-gray-300 rounded-lg p-3"
              />

              <p
                id="name-error"
                class="text-red-600 text-sm mt-1"
                aria-live="polite"
              ></p>
            </div>

            <!-- Cuisine -->
            <div>
              <label
                for="recipe-cuisine"
                class="block mb-2 font-medium"
              >
                Cuisine
              </label>

              <input
                type="text"
                id="recipe-cuisine"
                name="cuisine"
                required
                aria-describedby="cuisine-error"
                placeholder="Ex : Moroccan"
                class="w-full border border-gray-300 rounded-lg p-3"
              />

              <p
                id="cuisine-error"
                class="text-red-600 text-sm mt-1"
                aria-live="polite"
              ></p>
            </div>

            <!-- Difficulté -->
            <div>
              <label
                for="recipe-difficulty"
                class="block mb-2 font-medium"
              >
                Difficulté
              </label>

              <select
                id="recipe-difficulty"
                name="difficulty"
                required
                aria-describedby="difficulty-error"
                class="w-full border border-gray-300 rounded-lg p-3"
              >
                <option value="">Choisir une difficulté</option>
                <option value="Easy">Facile</option>
                <option value="Medium">Moyenne</option>
                <option value="Hard">Difficile</option>
              </select>

              <p
                id="difficulty-error"
                class="text-red-600 text-sm mt-1"
                aria-live="polite"
              ></p>
            </div>

            <!-- Temps de préparation -->
            <div>
              <label
                for="recipe-time"
                class="block mb-2 font-medium"
              >
                Temps de préparation (minutes)
              </label>

              <input
                type="number"
                id="recipe-time"
                name="prepTimeMinutes"
                min="1"
                max="300"
                step="1"
                required
                aria-describedby="time-error"
                placeholder="Ex : 30"
                class="w-full border border-gray-300 rounded-lg p-3"
              />

              <p
                id="time-error"
                class="text-red-600 text-sm mt-1"
                aria-live="polite"
              ></p>
            </div>

            <!-- Boutons -->
            <div class="flex justify-end gap-3 mt-2">
              <button
                type="button"
                id="close-dialog"
                class="border border-gray-300 px-5 py-3 rounded-lg"
              >
                Annuler
              </button>

              <button
                type="submit"
                id="submit-button"
                class="bg-primary text-white px-5 py-3 rounded-lg"
              >
                Ajouter
              </button>
            </div>
          </form>

          <!-- Message de succès -->
          <p
            id="success-message"
            class="text-green-600 mt-4"
            role="status"
            aria-live="polite"
          ></p>
        </dialog>
      </div>

      <!-- Chargement -->
      <p
        id="loading"
        class="text-center hidden mb-6"
        role="status"
      >
        Chargement des recettes...
      </p>

      <!-- Erreur -->
      <div
        id="error"
        class="text-center text-red-600 hidden mb-6"
        role="alert"
      >
        <p>Impossible de charger les recettes.</p>

        <button
          id="retry-button"
          type="button"
          class="underline mt-2"
        >
          Réessayer
        </button>
      </div>

      <!-- Aucun résultat -->
      <div
        id="no-results"
        class="text-center mb-8 hidden"
      >
        <p class="text-xl font-semibold text-text mb-3">
          Aucune recette trouvée.
        </p>

        <button
          id="show-all-button"
          type="button"
          class="bg-primary text-white px-6 py-3 rounded-lg"
        >
          Afficher toutes les recettes
        </button>
      </div>

      <!-- Cartes des recettes -->
      <section
        id="recipes-container"
        aria-label="Liste des recettes"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      ></section>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
