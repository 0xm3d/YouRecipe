
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouRecipe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="bg-white shadow-sm p-6">
      <h1 class="text-3xl font-bold text-primary text-center">YouRecipe</h1>
      <p class="text-text text-center mt-2">
        Découvrez vos recettes préférées.
      </p>
    </header>

    <main class="max-w-7xl mx-auto p-6">

      <!-- Titre et nombre de recettes -->
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold text-text">Explorer les recettes</h2>

        <p class="text-text">
          Nombre total de recettes : <span id="recipe-count">0</span>
        </p>
      </div>

      <!-- Recherche -->
      <div class="flex gap-3 mb-8">
        <input
          id="search-input"
          type="text"
          placeholder="Rechercher une recette..."
          class="flex-1 border border-gray-300 rounded-lg px-4 py-3"
        />

        <button
          id="search-button"
          class="bg-primary text-white px-6 py-3 rounded-lg"
        >
          Rechercher
        </button>
      </div>

      <!-- Chargement -->
      <p id="loading" class="text-center hidden mb-6">
        Chargement des recettes...
      </p>

      <!-- Erreur -->
      <div id="error" class="text-center text-red-600 hidden mb-6">
        <p>Impossible de charger les recettes.</p>
        <button id="retry-button" class="underline mt-2">
          Réessayer
        </button>
      </div>

      <!-- Aucun résultat -->
      <div id="no-results" class="text-center mb-8 hidden">
        <p class="text-xl font-semibold text-text mb-3">
          Aucune recette trouvée.
        </p>

        <button
          id="show-all-button"
          class="bg-primary text-white px-6 py-3 rounded-lg"
        >
          Afficher toutes les recettes
        </button>
      </div>

      <!-- Cartes des recettes -->
      <section
        id="recipes-container"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      ></section>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
