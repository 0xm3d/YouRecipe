
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouRecipe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="bg-white shadow-sm p-6">
      <h1 class="text-3xl font-bold text-primary text-center">YouRecipe</h1>
      <p class="text-text text-center mt-2">Discover your favorite recipes.</p>
    </header>

    <main class="max-w-7xl mx-auto p-6">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold text-text">Explore Recipes</h2>

        <p class="text-text">
          Total recipes: <span id="recipe-count">0</span>
        </p>
      </div>

      <p id="loading" class="text-center hidden">Loading recipes...</p>

      <p id="error" class="text-center text-red-600 hidden">
        Unable to load recipes.
      </p>

      <section
        id="recipes-container"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      ></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
